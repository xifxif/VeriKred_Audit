<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<defs><style>.t{font: bold 22px Arial;fill:#16324f}.s{font:16px Arial;fill:#233746}.box{fill:#f5f8fc;stroke:#4776a8;stroke-width:2;rx:16}.off{fill:#fff8e8;stroke:#b8872d;stroke-width:2;rx:16}.chain{fill:#eef8f1;stroke:#39845a;stroke-width:2;rx:16}.line{stroke:#526b82;stroke-width:3;fill:none}.dash{stroke:#b8872d;stroke-width:2.5;stroke-dasharray:8 6;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526b82"/></marker></defs>
